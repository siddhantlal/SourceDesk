name: Native PostgreSQL integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
          enable-cache: true
      - name: Install locked Python environment
        run: uv sync --locked --python 3.12.13
      - name: Install pinned native PostgreSQL 18.6 and pgvector 0.8.1
        run: sudo -n bash scripts/setup-postgres-wsl.sh --install
      - name: Provision, migrate, and verify separate application and test databases
        run: uv run --locked python scripts/setup_db.py --migrate both
      - name: Export masked private settings
        run: |
          uv run --locked python - <<'PY'
          import os
          from dotenv import dotenv_values
          values = dotenv_values('.env')
          keys = ('SOURCEDESK_DATABASE_URL', 'SOURCEDESK_TEST_DATABASE_URL', 'SOURCEDESK_JWT_SECRET')
          for key in keys:
              print('::add-mask::' + values[key])
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key in keys:
                  output.write(key + '=' + values[key] + '\n')
              output.write('SOURCEDESK_PROVIDER=fake\n')
          PY
      - name: Verify native vectors and run integration tests (fake model provider)
        run: |
          uv run --locked python scripts/setup_db.py --check
          uv run --locked pytest -q
      - name: Static checks
        run: |
          uv run --locked ruff check sourcedesk scripts tests
          uv run --locked mypy sourcedesk
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Frontend syntax and focused tests
        run: |
          npm --prefix frontend run check
          npm --prefix frontend test
